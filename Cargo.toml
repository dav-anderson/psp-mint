[package]
name = "psp-mint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
mint-core = { git = "https://github.com/dav-anderson/mint-core", tag = "v0.1.0" }
mint-types = { git = "https://github.com/dav-anderson/mint-core", tag = "v0.1.0" }
bdhke = { git = "https://github.com/dav-anderson/mint-core", tag = "v0.1.0" }
mint-server = { git = "https://github.com/dav-anderson/mint-core", tag = "v0.1.0" }
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "rand"] }
hex = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
